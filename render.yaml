services:
  - type: web
    name: kriya-omnitask
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: HOSTING_REGION
        value: ap-south-1
      - key: OPENROUTER_API_KEY
        sync: false
